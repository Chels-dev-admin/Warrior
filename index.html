<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warrior Training Log</title>
<meta name="theme-color" content="#5b1428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warrior">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: steady, strong, warm — a coach in your pocket, never preachy
   IDEA: a warrior's field journal: each day's orders and the record of what was done, on one page
   PICTURE: the cycle ring — a shield-like dial of the month in phase colours, marking today
   COLOUR and TYPE: garnet band, bone-white page, gold accent; Cinzel for the carved headings, Figtree for the rest
   LAYOUT: phone-first single column; hero ring + status, then guidance, session, feel, food, body; tabs at the foot */
:root{color-scheme:light dark;
--bg:light-dark(#f7f2f0,#140b0f);--card:light-dark(#fff,#21141a);--ink:light-dark(#1d1216,#f4eaed);
--mute:light-dark(#6e5860,#b8a1a9);--line:light-dark(#eadde1,#3a2830);--soft:light-dark(#f3ebee,#2b1b22);
--hero:light-dark(#5b1428,#3a0c1a);--heroink:#fbeef1;--gold:#f0b43c;--goldink:light-dark(#8a5a00,#f0b43c);
--p1:#d0384f;--p2:#2f9c86;--p3:#e3a03a;--p4:#8a64c9}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:19px;letter-spacing:.02em}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.hero{background:var(--hero);color:var(--heroink);padding:calc(10px + env(safe-area-inset-top)) 0 22px}
.datebar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.datebar .lbl{font-weight:600;font-size:17px;text-align:center;flex:1}
.ib{width:44px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;font-size:22px;cursor:pointer}
.chip-today{display:inline-block;margin-top:2px;font-size:13px;color:var(--gold);background:none;border:0;cursor:pointer;padding:4px 8px;min-height:32px}
.herogrid{display:flex;gap:18px;align-items:center;margin-top:12px}
.ring{width:150px;height:150px;flex:none}
.ring text{font-family:Cinzel,serif;fill:var(--heroink)}
.status{flex:1}
.status .k{font-size:13px;opacity:.75}
.status .v{font-size:17px;font-weight:600;margin-bottom:8px}
.status .v b{color:var(--gold);font-weight:600}
.sess{margin-top:16px;font-size:clamp(26px,7vw,34px)}
.sess small{display:block;font-family:Figtree,sans-serif;font-size:14px;opacity:.8;margin-top:6px;letter-spacing:0}
.hbtn{margin-top:10px;background:var(--gold);color:#2a1a00;border:0;border-radius:22px;padding:0 16px;min-height:40px;font:600 14px Figtree,sans-serif;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{margin-bottom:10px}
.call{border-left:0;position:relative}
.call .tag{display:inline-block;color:#fff;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-bottom:8px}
.call p{margin:6px 0}
.call .lab{font-weight:700;font-size:13px;color:var(--mute);display:block;margin-top:10px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.exh b{font-weight:600}
.rx{font-weight:700;white-space:nowrap;color:var(--goldink)}
.meta{font-size:13px;color:var(--mute)}
.exin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 44px;gap:8px;margin-top:8px}
input,textarea,select{font:16px Figtree,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tick{appearance:none;-webkit-appearance:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0}
.tick:checked{background:var(--p2);border-color:var(--p2)}
.tick:checked::after{content:"";width:12px;height:20px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.li{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li span{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:0 14px;min-height:40px;font:500 14px Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--hero);color:var(--heroink);border-color:var(--hero)}
.chip small{color:var(--mute);margin-left:4px}
.chip.on small{color:inherit;opacity:.8}
.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--p2);border-radius:6px;transition:width .3s}
.bar i.over{background:var(--p3)}
.tot{display:flex;justify-content:space-between;font-size:15px}
.tot b{font-variant-numeric:tabular-nums}
.food{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.food span{flex:1}
.food em{font-style:normal;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:18px;border:0;background:var(--soft);color:var(--mute);font-size:18px;cursor:pointer;flex:none}
.addf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;align-items:end}
.btn{background:var(--hero);color:var(--heroink);border:0;border-radius:10px;min-height:44px;padding:0 16px;font:600 15px Figtree,sans-serif;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{font-size:13px;color:var(--mute);display:block}
label.f input{margin-top:4px}
.range{display:flex;align-items:center;gap:12px}
.range input{padding:0;min-height:44px;accent-color:var(--hero);border:0;background:none}
.range b{font-family:Cinzel,serif;font-size:24px;width:2ch;text-align:right}
.grid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:4px;font-size:12px}
.grid .h{text-align:center;color:var(--mute)}
.grid .w{color:var(--mute);align-self:center}
.cell{aspect-ratio:1;border-radius:6px;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;font:700 13px Figtree,sans-serif;background:var(--soft);padding:0}
.cell.pred{opacity:.45}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.blk{grid-column:1/-1;font-family:Cinzel,serif;font-size:14px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
.lift{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:0}
.lift div{flex:1}
.lift svg{width:110px;height:34px;flex:none}
.lift .up{color:var(--p2);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;max-width:200px;min-height:60px;border:0;background:none;color:var(--mute);font:600 14px Figtree,sans-serif;cursor:pointer;border-top:3px solid transparent}
.nav button.on{color:var(--ink);border-top-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.empty{color:var(--mute);font-size:15px}
a{color:var(--goldink)}
.scan{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.scan[hidden]{display:none}
.scanin{max-width:600px;margin:0 auto}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:12px 0}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.res{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;color:var(--ink);font:15px Figtree,sans-serif;cursor:pointer;min-height:52px}
.res span{flex:1}.res small{display:block;color:var(--mute);font-size:13px}
.src{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--mute);white-space:nowrap}
.ing{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ing small{display:block;color:var(--mute);font-size:13px}
.big{font-family:Cinzel,serif;font-size:26px}
.scanhead{display:flex;justify-content:space-between;align-items:center}
@media(max-width:400px){.ring{width:124px;height:124px}.herogrid{gap:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav">
  <button data-view="today" class="on">Today</button>
  <button data-view="progress">12 weeks</button>
  <button data-view="setup">Setup</button>
</nav>
<div class="scan" id="scan" hidden><div class="scanin">
  <div class="scanhead"><h2 id="scantitle">Find food</h2><button class="x" data-act="scanclose" aria-label="Close scanner">×</button></div>
  <form id="srch2" class="row" style="margin-top:10px"><input name="q" placeholder="Search foods, e.g. green apple" aria-label="Search foods" style="flex:1" enterkeyhint="search"><button class="btn">Search</button></form>
  <div class="scanbox" id="scanbox"><video id="scanv" playsinline muted autoplay></video><div class="scanframe"></div></div>
  <p id="scanmsg" class="meta">Point the camera at the barcode</p>
  <form id="codef" class="row"><input name="c" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number" style="flex:1"><button class="btn">Look up</button></form>
  <div id="scanres"></div>
</div></div>
<div class="scan" id="rec" hidden><div class="scanin" id="recin"></div></div>
<div class="toast" id="toast"></div>
<script>
{
const PLAN_URL='https://claude.ai/artifact/NDNA1aVVpRDNRfyFWthmPZ';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>iso(new Date());
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};

/* ---------- plan data ---------- */
const SESS={
A:{name:'Lower strength',code:'A',sub:'Squat focus · gym · 60–70 min',ex:[
 ['sq','Back squat',4,'5–7',1,'4–6','2–3 min rest · brace hard, full depth'],
 ['rdl','Romanian deadlift',3,'8–10',0,0,'2 min · slow lowering'],
 ['bss','Bulgarian split squat',3,'8–10 / leg',0,0,'90 s · lean forward for glutes'],
 ['lc','Leg curl',3,'10–12',0,0,'60 s'],
 ['calf','Standing calf raise',3,'12–15',0,0,'60 s'],
 ['hkr','Hanging knee raise',3,'10–15',0,0,'60 s · control the swing']]},
B:{name:'Upper strength',code:'B',sub:'Press + pull · gym · 60 min',ex:[
 ['ohp','Standing overhead press',4,'5–7',1,'4–6','2–3 min · your warrior-shoulders lift'],
 ['pu','Pull-up (assisted or band)',4,'5–8',0,0,'2 min · log kg of assistance as negative'],
 ['idb','Incline dumbbell press',3,'8–10',0,0,'90 s'],
 ['csr','Chest-supported row',3,'8–10',0,0,'90 s · squeeze shoulder blades'],
 ['lat','Dumbbell lateral raise',3,'12–15',0,0,'60 s · light and strict'],
 ['pal','Pallof press',3,'10 / side',0,0,'60 s']]},
C:{name:'Lower power',code:'C',sub:'Hinge + glutes · gym · 60–70 min',ex:[
 ['jump','Box jump or KB jump squat',3,'5',0,0,'90 s · explosive, step down. Skip on a rough period day'],
 ['dl','Deadlift (trap-bar or conventional)',4,'4–6',1,'4–6','3 min'],
 ['ht','Barbell hip thrust',4,'8–12',0,0,'2 min · pause 1 s at the top'],
 ['wl','Walking lunge',3,'10 / leg',0,0,'90 s'],
 ['abd','Cable or band hip abduction',3,'15',0,0,'60 s'],
 ['abw','Ab wheel rollout',3,'8–12',0,0,'60 s · kneeling is fine']]},
D:{name:'Upper hypertrophy',code:'D',sub:'Shoulders + back + finisher · gym · 75 min',fin:1,ex:[
 ['sdp','Seated dumbbell shoulder press',3,'8–12',0,0,'90 s'],
 ['lpd','Lat pulldown',3,'10–12',0,0,'90 s · wide grip'],
 ['sar','Single-arm dumbbell row',3,'10 / arm',0,0,'60 s'],
 ['clr','Cable lateral raise',3,'12–15',0,0,'60 s'],
 ['fp','Face pull',3,'15',0,0,'60 s · rear delts'],
 ['push','Push-up',3,'max reps',0,0,'60 s · elevate hands if needed'],
 ['arms','Curl + triceps pushdown superset',2,'12 each',0,0,'60 s']]},
HOME:{name:'Office day',code:'',sub:'Optional 20-min home session',list:['3 rounds: 10 goblet squats, 10 single-arm rows each side, 12 kettlebell swings, 10 push-ups, 30 s plank','5 min mobility: hip flexor stretch, 90/90 hips, thoracic rotations, child\'s pose','Walk 8,000+ steps','Busy day? Just do the mobility.']},
REST:{name:'Office day',code:'',sub:'Rest and recover',list:['Walk 8,000+ steps: stairs, lunchtime walk','Pack lunch so protein stays on track','Lights out in time for 7–9 h sleep']},
SUN:{name:'Optional conditioning',code:'',sub:'Full circuit, or a long walk or hike',cond:1,list:[]}
};
const WEEKDAY=['SUN','A','HOME','B','REST','C','D'];
const STATIONS=['Kettlebell swing','Sled push (or rower sprint)','Heavy farmer\'s carry','Battle ropes (or burpees)','Dead bug, slow'];
const BLOCKS=['Foundation','Build','Sculpt'];
const PH={
period:{label:'Period',col:'var(--p1)',train:'Bad day? Drop working weights 10–20%, cut one set per lift, or swap in the home session or a walk. Good day? Train as normal.',food:'Eat iron-rich food with vitamin C: red meat, lentils, spinach plus citrus. Heat packs and magnesium-rich foods can help cramps.'},
follicular:{label:'Follicular',col:'var(--p2)',train:'Push days. Chase rep and weight PRs and take the extra set.',food:'Normal targets. Put most carbs around training to fuel the heavy work.'},
ovulation:{label:'Ovulation',col:'var(--p3)',train:'Often your strongest days. Lift heavy, but warm up thoroughly and keep technique strict.',food:'Normal targets.'},
luteal:{label:'Luteal',col:'var(--p4)',train:'Keep the weights, but stop 1–2 reps further from failure and rest 30–60 s longer. If you feel flat, make conditioning steady rather than all-out.',food:'Drink more water; you\'ll sweat more. Keep salty processed food low to limit bloating.'}
};
const QUICK=[['Yoghurt, oats & berries',400,30],['Chicken, rice & salad',550,45],['Banana + rice cakes & PB',300,7],['Salmon, potatoes & greens',550,38],['Whey shake',150,22],['Eggs on sourdough',450,26],['Beef & lentil bowl',550,42],['Protein smoothie',350,35],['Stir-fry with noodles',550,35],['Dark choc + tea',150,2]];
const SYMS=['Great','Low energy','Cramps','Bloating','Headache','Sore','Poor sleep'];
const LIFTS=[['sq','Back squat'],['dl','Deadlift'],['ohp','Overhead press'],['ht','Hip thrust'],['pu','Pull-up']];

/* ---------- state ---------- */
const defaults=()=>({programStart:'',cycleLen:28,periodLen:5,periods:[],hormonal:false});
let settings=defaults(),days={},cur=today(),view='today';
try{const raw=localStorage.getItem('wg-log');if(raw){const o=JSON.parse(raw);settings=Object.assign(defaults(),o.settings||{});days=o.days||{}}}catch(e){}
const persistLocal=()=>{try{localStorage.setItem('wg-log',JSON.stringify({settings,days}))}catch(e){}};
const day=d=>days[d]||(days[d]={});
const store={mode:'local',db:null,col:null};
let syncNote='Your log is saved on this phone and works offline. Back it up now and then: if you clear Safari or Chrome data, the log goes with it.';
const timers={},busy={};
function save(id){
  persistLocal();
  if(store.mode!=='cloud')return;
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{
    timers[id]=null;
    const body=JSON.parse(JSON.stringify(id==='settings'?settings:(days[id.slice(1)]||{})));
    busy[id]=(busy[id]||0)+1;
    store.db.collection(store.col).doc(id).set(body).catch(e=>toast('Couldn\'t save: '+(e&&e.code||'error')+'. Kept on this device.')).finally(()=>{busy[id]--});
  },700);
}
const saveDay=d=>save('d'+d);
const saveSettings=()=>save('settings');
function addMeal(m){(settings.meals||(settings.meals=[])).push(m);saveSettings()}

/* ---------- calculations ---------- */
function cycleLen(){
  const p=[...settings.periods].sort(),gaps=[];
  for(let i=1;i<p.length;i++){const g=diff(p[i],p[i-1]);if(g>=18&&g<=45)gaps.push(g)}
  const g=gaps.slice(-6);
  return g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):(+settings.cycleLen||28);
}
function phaseOf(n,L){const P=+settings.periodLen||5,ov=L-14;return n<=P?'period':n<ov-1?'follicular':n<=ov+1?'ovulation':'luteal'}
function cycleInfo(date){
  const p=settings.periods.filter(x=>x<=date).sort();
  if(!p.length)return null;
  const L=cycleLen();let n=diff(date,p[p.length-1])+1,pred=false;
  if(date>today()&&n>L){n=((n-1)%L)+1;pred=true}
  const phase=phaseOf(Math.min(n,L),L);
  return {n,L,phase,pred,late:phase==='luteal'&&n>L-7,due:n>L};
}
function prog(date){
  if(!settings.programStart)return null;
  const w=Math.floor(diff(date,settings.programStart)/7)+1;
  if(w<1)return {w,pre:1};if(w>12)return {w,post:1};
  return {w,b:w<=4?0:w<=8?1:2,deload:w%4===0,test:w===11};
}
function rx(e,p){
  let s=e[2],r=e[3];
  if(p&&!p.pre&&!p.post){
    if(p.b===1&&e[4])s+=1;
    if(p.b===2){if(e[4]){s=4;r=e[5]||r}else s+=1}
    if(p.deload)s=Math.ceil(s/2);
  }
  return s+' × '+r;
}
function rirText(p){if(!p||p.pre||p.post)return 'Leave 1–3 reps in the tank';if(p.deload)return 'Deload: about 70% of usual weights, finish fresh';return p.b===0?'Leave about 3 reps in the tank (RIR 3)':'Leave 1–2 reps in the tank (RIR 1–2)'}
function targets(ci){const late=ci&&ci.late&&!settings.hormonal;return {kcal:late?2075:1950,protein:130,water:late||(ci&&ci.phase==='luteal')?'3+ L':'2.5–3 L'}}
function foodTot(d){const f=(days[d]&&days[d].food)||[];return f.reduce((a,x)=>({k:a.k+num(x.k),p:a.p+num(x.p)}),{k:0,p:0})}
function lastOf(k,before){
  const ds=Object.keys(days).filter(d=>d<before&&days[d].ex&&days[d].ex[k]&&(days[d].ex[k].w||days[d].ex[k].r)).sort();
  if(!ds.length)return null;const d=ds[ds.length-1];return {d,...days[d].ex[k]};
}
const fmtDate=(d,o)=>parse(d).toLocaleDateString('en-AU',o||{weekday:'short',day:'numeric',month:'short'});

/* ---------- views ---------- */
function ringSVG(ci){
  const L=ci?ci.L:cycleLen(),R=72,c=90,gap=.012,pt=(a,r)=>[(c+r*Math.sin(a)).toFixed(2),(c-r*Math.cos(a)).toFixed(2)];
  let arcs='';
  for(let i=0;i<L;i++){

function totsHTML(t,T){
  const bar=(v,m)=>`<div class="bar"><i class="${v>m*1.05?'over':''}" style="width:${Math.min(100,v/m*100).toFixed(0)}%"></i></div>`;

}
function spark(pts){
  if(pts.length<2)return '';
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs)||1,y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=x=>4+(x-x0)/((x1-x0)||1)*102,sy=y=>30-(y-y0)/((y1-y0)||1)*26;
  return `<svg viewBox="0 0 110 34" aria-hidden="true"><polyline fill="none" stroke="var(--p2)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}"/></svg>`;
}

  }).join('');

  }

/* ---------- Cronometer CSV import ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function toISO(v){
  v=(v||'').trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // Cronometer exports US-style M/D/YYYY
  if(m)return m[3]+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return null;
}
function importCron(text){
  const rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2)throw 'empty';
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=h.findIndex(x=>x===n||x.startsWith(n));if(i>=0)return i}return -1};
  const iD=col('day','date'),iK=col('energy (kcal)','calories'),iP=col('protein (g)','protein'),iN=col('food name','food'),iA=col('amount'),iKJ=col('energy (kj)');
  if(iD<0||(iK<0&&iKJ<0))throw 'format';
  const isServ=iN>=0,byDay={};
  for(const r of rows.slice(1)){
    const d=toISO(r[iD]);if(!d)continue;
    const k=iK>=0?num(r[iK]):num(r[iKJ])/4.184,pr=iP>=0?num(r[iP]):0;
    (byDay[d]||(byDay[d]=[])).push(isServ?{n:(r[iN]||'Food').trim()+(iA>=0&&r[iA]?' ('+r[iA].trim()+')':''),k:Math.round(k),p:Math.round(pr*10)/10,src:'cron'}:{n:'Cronometer daily total',k:Math.round(k),p:Math.round(pr*10)/10,src:'cron'});
  }
  const ds=Object.keys(byDay);
  ds.forEach(d=>{const dd=day(d);dd.food=(dd.food||[]).filter(f=>f.src!=='cron').concat(byDay[d]);saveDay(d)});
  return {days:ds.length,items:ds.reduce((a,d)=>a+byDay[d].length,0),kind:isServ?'foods':'daily totals'};
}
document.addEventListener('change',e=>{
  if(e.target.id!=='cronfile'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const r=importCron(String(fr.result));render();toast('Imported '+r.items+' '+r.kind+' across '+r.days+' days')}catch(err){toast(err==='format'?'That file isn\'t a Cronometer Servings or Daily Nutrition export':'Couldn\'t read that file')}};
  fr.readAsText(e.target.files[0]);e.target.value='';
});

async function startCam(){
  const v=$('#scanv');smsg('Starting camera…');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    if('BarcodeDetector' in window){
      const fm=await BarcodeDetector.getSupportedFormats().catch(()=>[]);
      if(fm.includes('ean_13')){
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        v.srcObject=stream;await v.play();
        const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
        scanning=true;smsg('Point the camera at the barcode');
        const loop=async()=>{if(!scanning)return;try{const r=await det.detect(v);if(r.length){found(r[0].rawValue);return}}catch(e){}setTimeout(loop,200)};
        loop();return;
      }
    }
    await loadZX();
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    zx=new ZXing.BrowserMultiFormatReader(hints);scanning=true;smsg('Point the camera at the barcode');
    await zx.decodeFromConstraints({video:{facingMode:'environment'}},v,res=>{if(res&&scanning)found(res.getText())});
  }catch(e){scanning=false;$('#scanbox').hidden=true;smsg('Camera not available. Allow camera access for this app, or type the barcode number below.')}
}
function stopCam(){

  stream=null;v.srcObject=null;

async function lookup(code){

  $('#scanres').innerHTML='';smsg('Looking up '+code+'…');

  const out=[];
  (settings.recipes||[]).forEach((r,i)=>{if(matchQ(q,r.name))out.push({name:r.name,k100:r.k100,p100:r.p100,serv:r.serv,servTxt:r.serv?'1 serving':'',src:'Recipe'})});
  Object.entries(settings.foods||{}).forEach(([c,f])=>{if(f.k100!=null&&matchQ(q,f.name))out.push({...f,code:c,src:'Saved'})});
  COMMON.forEach(c=>{if(matchQ(q,c[0]+' '+(c[5]||'')))out.push({name:c[0],k100:c[1],p100:c[2],serv:c[3],servTxt:c[4]+' ≈ '+c[3]+' g',src:'Typical'})});
  return out;
}
async function offSearch(q){
  const u='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,brands,nutriments,serving_quantity,serving_size,countries_tags';
  const r=await fetch(u);const j=await r.json();
  return (j.products||[]).map(pr=>{const n=pr.nutriments||{};let k=n['energy-kcal_100g'];const kj=n['energy-kj_100g']!=null?n['energy-kj_100g']:n['energy_100g'];if(k==null&&kj!=null)k=kj/4.184;
    const brand=pr.brands?String(pr.brands).split(',')[0].trim():'',nm=(pr.product_name||'').trim();
    return {name:(nm&&brand&&!nm.toLowerCase().includes(brand.toLowerCase())?brand+' '+nm:nm||brand),k100:k!=null&&isFinite(+k)?+k:null,p100:n.proteins_100g!=null&&isFinite(+n.proteins_100g)?+n.proteins_100g:null,serv:+pr.serving_quantity||null,servTxt:pr.serving_size||'',code:pr.code,src:'Open Food Facts',au:(pr.countries_tags||[]).includes('en:australia')}})
   .filter(x=>x.name&&x.k100!=null).sort((a,b)=>(b.au?1:0)-(a.au?1:0));
}
function resRows(list,act){return list.map((r,i)=>`<button class="res" data-${act}="${i}"><span>${esc(r.name)}<small>Per 100 g: ${Math.round(r.k100)} kcal · ${r.p100!=null?(+r.p100).toFixed(1)+' g protein':'protein ?'}${r.servTxt?' · '+esc(r.servTxt):''}</small></span><em class="src">${r.au?'AU · ':''}${r.src}</em></button>`).join('')}
async function runSearch(q,target,act,onDone){
  q=(q||'').trim();if(!q)return;
  const loc=localSearch(q);lastRes=loc.slice();
  const el=$(target);
  el.innerHTML=(loc.length?resRows(loc,act):'')+'<p class="meta" id="offst">Searching packaged products…</p>';
  try{const off=await offSearch(q);lastRes=loc.concat(off);el.innerHTML=lastRes.length?resRows(lastRes,act)+'<p class="meta">"Typical" values are generic averages. Packaged products come from Open Food Facts, filled in by volunteers, so check them against the label.</p>':'<p class="empty">No matches. Try fewer words, or enter the label values yourself.</p>'}
  catch(e){const st=document.getElementById('offst');if(st)st.textContent=loc.length?'Couldn\'t reach Open Food Facts, so packaged products aren\'t shown.':'No built-in match, and Open Food Facts can\'t be reached right now.'}
  onDone&&onDone();
}
function openFind(q){
  $('#scan').hidden=false;document.body.style.overflow='hidden';$('#scantitle').textContent='Find food';$('#scanbox').hidden=true;smsg('');$('#scanres').innerHTML='';
  if(q){$('#srch2').q.value=q;runSearch(q,'#scanres','pick')}else setTimeout(()=>$('#srch2').q.focus(),50);
}

/* ---------- recipe calculator ---------- */
let rec=null;
function newRec(){return {name:'',items:[],cooked:'',servings:'',idx:null}}
function recTotals(){const t=rec.items.reduce((a,x)=>({k:a.k+x.k100*num(x.g)/100,p:a.p+(x.p100||0)*num(x.g)/100,g:a.g+num(x.g)}),{k:0,p:0,g:0});return t}
function openRec(r,idx){rec=r?JSON.parse(JSON.stringify(r)):newRec();if(idx!=null)rec.idx=idx;$('#rec').hidden=false;document.body.style.overflow='hidden';drawRec()}
function closeRec(){$('#rec').hidden=true;document.body.style.overflow='';rec=null}
function drawRec(){
  const t=recTotals(),cooked=num(rec.cooked)||t.g,sv=num(rec.servings);
  $('#recin').innerHTML=`<div class="scanhead"><h2>Recipe calculator</h2><button class="x" data-act="recclose" aria-label="Close">×</button></div>
  <label class="f" style="margin-top:10px">Recipe name<input id="rname" value="${esc(rec.name)}" placeholder="e.g. Turkey bolognese"></label>
  <div class="card"><h2 style="font-size:16px">Ingredients <span class="meta" style="font-family:Figtree,sans-serif">(raw weights)</span></h2>
  ${rec.items.map((x,i)=>`<div class="ing"><div>${esc(x.n)}<small>${Math.round(x.k100*num(x.g)/100)} kcal · ${((x.p100||0)*num(x.g)/100).toFixed(1)} g protein</small></div><input inputmode="decimal" data-rg="${i}" value="${esc(x.g)}" aria-label="${esc(x.n)} grams"><button class="x" data-rdel="${i}" aria-label="Remove ${esc(x.n)}">×</button></div>`).join('')||'<p class="empty">Search below to add each ingredient, then set its weight in grams.</p>'}
  <form id="rsrch" class="row" style="margin-top:10px"><input name="q" placeholder="Add ingredient: search, e.g. lean mince" style="flex:1" enterkeyhint="search" aria-label="Search ingredient"><button class="btn">Search</button></form>
  <div id="rres"></div>
  <details style="margin-top:8px"><summary class="meta" style="cursor:pointer;min-height:32px">Enter an ingredient from its label</summary>
   <form id="rman" style="margin-top:6px"><input name="n" placeholder="Ingredient name" required>
   <div class="g2" style="margin-top:8px"><label class="f">Grams used<input name="g" inputmode="decimal" required></label><label class="f">Protein per 100 g<input name="p" inputmode="decimal"></label><label class="f">kJ per 100 g<input name="kj" inputmode="decimal"></label><label class="f">kcal per 100 g<input name="k" inputmode="decimal"></label></div>
   <button class="btn ghost" style="width:100%;margin-top:8px">Add ingredient</button></form></details></div>
  <div class="card"><h2 style="font-size:16px">The finished dish</h2>
   <div class="g2"><label class="f">Cooked weight (g)<input id="rcook" inputmode="decimal" value="${esc(rec.cooked)}" placeholder="${Math.round(t.g)||''}"></label><label class="f">Servings it makes<input id="rserv" inputmode="numeric" value="${esc(rec.servings)}" placeholder="optional"></label></div>
   <p class="meta">Weigh the pot full, then subtract the empty pot's weight. Left blank, the raw total is used.</p>
   <div id="rout">${recOut(t,cooked,sv)}</div>
   <button class="btn" data-act="recsave" style="width:100%;margin-top:10px">${rec.idx!=null?'Update recipe':'Save recipe'}</button>
   ${rec.idx!=null?'<button class="btn ghost" data-act="recdelete" style="width:100%;margin-top:8px">Delete recipe</button>':''}</div>`;
}
function recOut(t,cooked,sv){
  if(!rec.items.length)return '<p class="empty">Totals appear once you add ingredients.</p>';
  const k100=cooked?t.k/cooked*100:0,p100=cooked?t.p/cooked*100:0;
  return `<div class="tot"><span>Whole dish</span><b>${Math.round(t.k)} kcal · ${Math.round(t.p)} g protein</b></div>
  <div class="tot" style="margin-top:6px"><span>Per 100 g cooked</span><b class="big">${Math.round(k100)}<small style="font:600 14px Figtree"> kcal · ${p100.toFixed(1)} g</small></b></div>
  ${sv?`<div class="tot" style="margin-top:6px"><span>Per serving (${Math.round(cooked/sv)} g)</span><b>${Math.round(t.k/sv)} kcal · ${(t.p/sv).toFixed(1)} g protein</b></div>`:''}`;
}
function refreshRecOut(){if(!rec)return;const t=recTotals(),cooked=num(rec.cooked)||t.g;$('#rout').innerHTML=recOut(t,cooked,num(rec.servings))}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const ds=b.dataset,a=ds.act;
  if(ds.pick!=null){const r=lastRes[+ds.pick];if(r)showProduct(r.code||'',r);return}
  if(ds.rpick!=null){const r=lastRes[+ds.rpick];if(r&&rec){rec.items.push({n:r.name,g:r.serv||100,k100:r.k100,p100:r.p100});drawRec();toast('Added '+r.name+'. Set the grams you used')}return}
  if(ds.rdel!=null&&rec){rec.items.splice(+ds.rdel,1);drawRec();return}
  if(ds.rlog!=null){const r=(settings.recipes||[])[+ds.rlog];if(r){$('#scan').hidden=false;document.body.style.overflow='hidden';$('#scantitle').textContent='Log a serve';$('#scanbox').hidden=true;smsg('');showProduct('',{name:r.name,k100:r.k100,p100:r.p100,serv:r.serv,servTxt:r.serv?'1 serving = '+r.serv+' g':'',src:'recipe'})}return}
  if(ds.redit!=null){const r=(settings.recipes||[])[+ds.redit];if(r)openRec(r,+ds.redit);return}
  if(a==='recipe')openRec();
  else if(a==='recclose')closeRec();
  else if(a==='recsave'&&rec){
    const t=recTotals();if(!rec.items.length){toast('Add at least one ingredient');return}
    const name=(rec.name||'').trim()||'My recipe',cooked=num(rec.cooked)||t.g,sv=num(rec.servings);
    const r={name,k100:Math.round(t.k/cooked*1000)/10,p100:Math.round(t.p/cooked*1000)/10,serv:sv?Math.round(cooked/sv):null,cooked:rec.cooked,servings:rec.servings,items:rec.items};
    const L=settings.recipes||(settings.recipes=[]);if(rec.idx!=null)L[rec.idx]=r;else L.push(r);saveSettings();closeRec();render();toast('Saved '+name+'. Tap it under My recipes to log a serve');
  }
  else if(a==='recdelete'&&rec&&rec.idx!=null){settings.recipes.splice(rec.idx,1);saveSettings();closeRec();render();toast('Recipe deleted')}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!rec)return;
  if(t.id==='rname')rec.name=t.value;
  else if(t.id==='rcook'){rec.cooked=t.value;refreshRecOut()}
  else if(t.id==='rserv'){rec.servings=t.value;refreshRecOut()}
  else if(t.dataset.rg!=null){rec.items[+t.dataset.rg].g=t.value;const row=t.closest('.ing').querySelector('small'),x=rec.items[+t.dataset.rg];row.textContent=Math.round(x.k100*num(x.g)/100)+' kcal · '+((x.p100||0)*num(x.g)/100).toFixed(1)+' g protein';refreshRecOut()}
  else if(t.form&&t.form.id==='rman'&&(t.name==='kj'||t.name==='k')){const f=t.form,v=num(t.value);if(t.name==='kj')f.k.value=t.value.trim()?Math.round(v/4.184):'';else f.kj.value=t.value.trim()?Math.round(v*4.184):''}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='srchf'){e.preventDefault();openFind(f.q.value);f.q.value=''}
  else if(f.id==='srch2'){e.preventDefault();stopCam();$('#scanbox').hidden=true;smsg('');runSearch(f.q.value,'#scanres','pick')}
  else if(f.id==='rsrch'){e.preventDefault();runSearch(f.q.value,'#rres','rpick')}
  else if(f.id==='rman'){e.preventDefault();const k=num(f.k.value);if(!k||!num(f.g.value)){toast('Add grams and kcal or kJ per 100 g');return}rec.items.push({n:f.n.value.trim(),g:f.g.value,k100:k,p100:num(f.p.value)});drawRec()}
});

render();

/* ---------- offline app ---------- */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
